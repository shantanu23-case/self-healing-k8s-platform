apiVersion: apps/v1
kind: Deployment
metadata:
  name: healer
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healer
  template:
    metadata:
      labels:
        app: healer
    spec:
      serviceAccountName: healer-sa
      containers:
      - name: healer
        image: 242200985357.dkr.ecr.ap-south-1.amazonaws.com/self-heal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: healer-service
  namespace: demo
spec:
  selector:
    app: healer
  ports:
  - port: 5000
    targetPort: 5000