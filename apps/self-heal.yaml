apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfheal-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selfheal-demo
  template:
    metadata:
      labels:
        app: selfheal-demo
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: selfheal-demo
  namespace: demo
spec:
  selector:
    app: selfheal-demo
  ports:
  - port: 80
    targetPort: 80